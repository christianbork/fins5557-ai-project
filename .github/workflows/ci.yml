# Step 13: lint and test every pull request and every push to main.
# Needs neither the Kaggle data nor an API key: the tests use fake data (tests/test_data.py),
# the committed model in models/, and fake LLM clients.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_BACKEND: template  # never call a language model from CI
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Secret scan (detect-secrets)
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      - name: Test (pytest, with coverage of src/)
        run: pytest -q --cov
